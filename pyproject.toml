[project]
name = "chmabapay"
version = "0.1.0"
description = "Bakong KHQR payment platform (tenant / sub-merchant model) - Phase 1 POC"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "asyncpg>=0.29",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "python-jose[cryptography]>=3.3",
    "bcrypt>=4.1",
    "cachetools>=5.3",
    "APScheduler>=3.10",
    "segno>=1.6.6",
    "alembic>=1.13",
    # Metrics in the Prometheus exposition format, served from /metrics. The
    # client is the piece worth not hand-rolling: histogram buckets, label
    # escaping and the text format all have sharp edges.
    "prometheus-client>=0.20",
    "redis>=8.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.11",
    "fakeredis>=2.38.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chmabapay"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"
testpaths = ["tests"]
# `live` tests spend real ABA checkout sessions, so they are opt-in only:
#   pytest -m live
addopts = '-q -m "not live"'
markers = [
    "live: reaches the real ABA PayWay rail; excluded by default. Run with `pytest -m live`",
]

[tool.mypy]
python_version = "3.11"
files = ["src/chmabapay", "tests"]
ignore_missing_imports = true
namespace_packages = true
# Advisory in CI for now: 26 pre-existing errors in 9 files (measured with the
# mypy pinned in uv.lock). The job stays non-blocking until that reaches zero —
# see docs/production-readiness.md P0-4.

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
