# The edge for the production stack — TLS at the origin, one host port.
#
#   https://pay.chmaba.com        -> landing (marketing + merchant dashboard)
#   https://admin-pay.chmaba.com  -> admin   (the platform console)
#
# `admin-pay`, not `admin.pay`, and that is forced rather than chosen. Cloudflare's
# certificate covers `chmaba.com` and `*.chmaba.com`, and a wildcard matches exactly
# one label — so `*.chmaba.com` covers `pay.chmaba.com` (one label) but **not**
# `admin.pay.chmaba.com` (two). Observed: a TLS handshake to `admin.pay.chmaba.com`
# returns `SSL alert number 40` (handshake_failure) before Cloudflare can answer with
# an HTTP status at all. Reaching a two-level subdomain would need Cloudflare's paid
# Advanced Certificate Manager. Do not "tidy" this name back to `admin.pay.*`.
#
# Cloudflare proxies to this origin on **8443** with SSL mode **Full (strict)**, so
# the hop between Cloudflare and here is HTTPS and the certificate has to be one
# Cloudflare trusts: a Cloudflare **Origin CA** certificate with both names in its
# SAN, mounted read-only at /etc/nginx/certs/. See deploy/docker-compose.prod.yml.
#
# 8443 rather than 443 because this VPS already runs the chmaba POS stack, whose
# edge owns the host's 80 and 443. ChmabaPay is a second, independent compose
# project on the same machine; taking its own port is what keeps the two from being
# able to break each other. Nothing in this file knows the host port — nginx still
# listens on 443 inside its own container, and compose maps 8443:443.
#
# ---------------------------------------------------------------------------- #
# This file and deploy/nginx/nginx.conf must stay in sync.
# ---------------------------------------------------------------------------- #
#
# They are two edges of one application: nginx.conf is the local one (plain HTTP on
# the compose port, host routing by Host header), this is the production one. What
# differs between them is only this:
#
#   1. this file terminates TLS and has a certificate;
#   2. this file's proxy blocks do not include /etc/nginx/api-locations.inc twice
#      but they do include it — both files include it, unchanged;
#   3. this file resolves the real client address behind Cloudflare (see below);
#   4. the upstreams, the resolver, the maps and the proxy defaults are copies.
#
# So a change to the upstreams, the `resolve`/`zone` directives, the
# X-Forwarded-* maps, the proxy timeouts or deploy/nginx/api-locations.inc is a
# change to **both** files. The upstream `resolve` directives in particular: drop
# them and every request through the edge fails after the next `--build`, which is
# documented at length in nginx.conf and is not repeated here.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    # Not a secret, but it is free reconnaissance; nothing here needs the version
    # advertised in every response and error page.
    server_tokens off;

    log_format edge '$remote_addr $http_host "$request" $status $body_bytes_sent '
                    'rt=$request_time urt=$upstream_response_time';
    access_log /dev/stdout edge;

    # ------------------------------------------------------------------------ #
    # The real client address
    # ------------------------------------------------------------------------ #
    #
    # This is a security control, not a logging nicety. The API picks its
    # per-IP rate-limit bucket from the **first** entry of X-Forwarded-For
    # (src/chmabapay/ratelimit.py, `client_ip`), so whatever ends up first is the
    # identity the limit is applied to.
    #
    # With the default `$proxy_add_x_forwarded_for`, nginx *appends* the peer to
    # whatever the caller sent. A caller who sends `X-Forwarded-For: 1.2.3.4`
    # therefore has `1.2.3.4` as the first entry and is bucketed as 1.2.3.4 —
    # a fresh bucket per request, per chosen address, on every unauthenticated
    # surface. The per-key limits are unaffected (a key cannot be rotated away),
    # but the IP-keyed ones over /pay/* and /khqr/* would be bypassable.
    #
    # The fix is to stop forwarding a chain and forward a single, trusted address:
    # the `realip` module rewrites `$remote_addr` from Cloudflare's CF-Connecting-IP
    # header, and the proxy blocks below send `$remote_addr` rather than
    # `$proxy_add_x_forwarded_for`.
    #
    # `set_real_ip_from` only trusts the **peer**, so this cannot be spoofed by
    # connecting directly: an untrusted peer's CF-Connecting-IP is ignored and its
    # real address is used. The firewall rule restricting 8443 to these ranges is
    # still worth having — it keeps traffic off Cloudflare's WAF, DDoS protection and
    # caching — but this block is what makes the address trustworthy, not the
    # firewall, and it holds even if the firewall rule is missing.
    #
    # Ranges as published at cloudflare.com/ips-v4 and /ips-v6. **They change.**
    # Cloudflare adds ranges and retires old ones; a stale list means traffic from a
    # new edge arrives untrusted, which degrades to the peer address (honest, but
    # every Cloudflare edge then shares one bucket). Re-check the two URLs when
    # anything about client addresses looks wrong.
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive off;

    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream chmabapay_api {
        zone chmabapay_api 64k;
        server api:8000 resolve;
        keepalive 16;
    }
    upstream chmabapay_web {
        zone chmabapay_web 64k;
        server landing:3001 resolve;
        keepalive 16;
    }
    upstream chmabapay_admin {
        zone chmabapay_admin 64k;
        server admin:3002 resolve;
        keepalive 16;
    }

    # Forward the original scheme and host rather than this hop's. Cloudflare sets
    # X-Forwarded-Proto on the way in. This hop is HTTPS now, so the `$scheme`
    # fallback agrees with Cloudflare rather than contradicting it — but the map is
    # kept because the value decides whether the session cookie is marked Secure,
    # and a hardcoded `https` would be a claim about a hop nginx cannot see.
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }
    map $http_x_forwarded_host $forwarded_host {
        default $http_x_forwarded_host;
        ""      $host;
    }

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    # The realip module has already rewritten $remote_addr to Cloudflare's
    # CF-Connecting-IP, so this is one trusted address and not a chain the caller
    # can prepend to. See "The real client address" above.
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $remote_addr;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-Host  $forwarded_host;
    proxy_set_header Connection        "";
    proxy_connect_timeout 5s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    # ------------------------------------------------------------------------ #
    # TLS
    # ------------------------------------------------------------------------ #
    ssl_protocols TLSv1.2 TLSv1.3;
    # Ciphers are left at nginx's defaults deliberately. The other end of this
    # handshake is Cloudflare, which has its own preferred list; a hand-tuned string
    # here can only remove something Cloudflare wanted, and the failure it produces
    # is an origin handshake error rather than a clear message.
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1h;

    # ------------------------------------------------------------------------ #
    # :80 — healthcheck, and a redirect for everything else
    # ------------------------------------------------------------------------ #
    #
    # This block exists because the container healthcheck asks for /nginx-health on
    # plain HTTP, which needs no certificate and no trust in the Origin CA cert
    # (the `wget` in nginx:alpine has no reason to trust it).
    #
    # The redirect is in a `location` and not at server level on purpose. A
    # server-level `return` runs in the rewrite phase, *before* a location is
    # selected, so a server-level 301 here would swallow /nginx-health and the
    # healthcheck would receive a redirect instead of a 200 — the container would
    # never report healthy and the whole stack would refuse to start.
    server {
        listen 80 default_server;
        server_name _;

        location = /nginx-health {
            access_log off;
            return 200 "ok\n";
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ------------------------------------------------------------------------ #
    # :443 — a Host we do not serve
    # ------------------------------------------------------------------------ #
    #
    # Without a default_server here, nginx answers a request for an unknown Host
    # with the first `listen 443` block in the file — i.e. it serves the real
    # website for any hostname pointed at this origin, which is useful to whoever
    # is impersonating us and confusing to whoever is configuring DNS.
    #
    # 404 rather than closing the connection: during setup, "the site returns 404"
    # is a diagnosable symptom and "the connection was reset" is not.
    server {
        listen 443 ssl default_server;
        http2 on;
        server_name _;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        return 404;
    }

    # ------------------------------------------------------------------------ #
    # pay.chmaba.com — marketing, the merchant dashboard, and the API paths they use
    # ------------------------------------------------------------------------ #
    server {
        listen 443 ssl;
        http2 on;
        server_name pay.chmaba.com;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        include /etc/nginx/security-headers.inc;

        # HSTS, deliberately without `includeSubDomains`.
        #
        # `chmaba.com` and every other subdomain of it belong to the neighbouring POS
        # stack on this host. A browser that learned `includeSubDomains` from a
        # response here would refuse plain HTTP for all of them — one project's header
        # reaching into another's domain. Without it, the pin applies to this hostname
        # only, which is the whole of what this deployment owns.
        #
        # Note that Cloudflare terminates TLS in front of this, and whether it passes
        # an origin's HSTS header through depends on the zone's settings; the belt-and-
        # braces path is the zone's own HSTS toggle (SSL/TLS -> Edge Certificates).
        # This line is what the repository controls, and it is verified from outside
        # after a deploy.
        add_header Strict-Transport-Security "max-age=31536000" always;

        location = /nginx-health {
            access_log off;
            return 200 "ok\n";
        }

        include /etc/nginx/api-locations.inc;

        # Content-hashed build output. Defines no header of its own on purpose: it
        # inherits the block above, so the security headers apply and Next's
        # `immutable` caching still reaches the browser.
        location /_next/static/ {
            proxy_pass http://chmabapay_web;
        }

        # The signed-in workspace. This is the one that had to change.
        #
        # Next.js marks its statically-rendered pages `Cache-Control:
        # s-maxage=31536000, stale-while-revalidate` — a **year** of shared caching.
        # For a marketing page that is merely stale; for these it is HTML belonging to
        # one merchant being offered to a shared cache. Cloudflare answers
        # `cf-cache-status: DYNAMIC` today so nothing is actually stored, which makes
        # this a latent hazard rather than an active leak — one cache rule, or one
        # different CDN in front, away from being real. `no-store` closes it at the
        # only place that cannot be forgotten by a later frontend change.
        location /dashboard {
            include /etc/nginx/security-headers.inc;
            add_header Strict-Transport-Security "max-age=31536000" always;
            add_header Cache-Control "no-store" always;
            proxy_hide_header Cache-Control;
            proxy_pass http://chmabapay_web;
        }

        # Public pages: cacheable, but for minutes rather than the year Next asks for.
        # A corrected legal clause, price or support address is then live within one
        # revalidation instead of being pinned in whichever cache saw it first.
        location / {
            include /etc/nginx/security-headers.inc;
            add_header Strict-Transport-Security "max-age=31536000" always;
            add_header Cache-Control "public, max-age=0, s-maxage=300, stale-while-revalidate=60" always;
            proxy_hide_header Cache-Control;
            proxy_pass http://chmabapay_web;
        }
    }

    # ------------------------------------------------------------------------ #
    # admin-pay.chmaba.com — the platform console
    # ------------------------------------------------------------------------ #
    server {
        listen 443 ssl;
        http2 on;
        server_name admin-pay.chmaba.com;

        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;

        include /etc/nginx/security-headers.inc;
        add_header Strict-Transport-Security "max-age=31536000" always;

        location = /nginx-health {
            access_log off;
            return 200 "ok\n";
        }

        include /etc/nginx/api-locations.inc;

        location /_next/static/ {
            proxy_pass http://chmabapay_admin;
        }

        # Everything else on this hostname is the operator console, so the whole host
        # is `no-store` rather than just a subpath. Nothing on it is public, nothing on
        # it is the same for two operators, and there is no page here whose caching
        # would be worth reasoning about later.
        location / {
            include /etc/nginx/security-headers.inc;
            add_header Strict-Transport-Security "max-age=31536000" always;
            add_header Cache-Control "no-store" always;
            proxy_hide_header Cache-Control;
            proxy_pass http://chmabapay_admin;
        }
    }
}
