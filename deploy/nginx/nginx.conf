# The edge for the containerised stack.
#
# Host-based routing on a single port, matching production: Cloudflare terminates
# TLS and forwards to this origin with the Host header intact, so `server_name` is
# what decides whether a request reaches the website or the admin console. The
# browser never talks to a Next.js container directly.

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    # The API's own log already carries the trace id, so this is deliberately thin:
    # what the edge adds is the real client address and the wall time for the hop.
    log_format edge '$remote_addr $http_host "$request" $status $body_bytes_sent '
                    'rt=$request_time urt=$upstream_response_time';
    access_log /dev/stdout edge;

    # Re-resolve upstream names as their addresses change.
    #
    # Without this, nginx resolves `api`, `landing` and `admin` **once** at config
    # load and caches the addresses for the life of the worker. `docker compose up
    # --build` recreates containers, and a recreated container gets a new IP, so the
    # cached one becomes unreachable and *every* request through the edge fails:
    #
    #   connect() failed (113: Host is unreachable) while connecting to upstream
    #     upstream: "http://172.18.0.4:8000/health"
    #
    # 502 on every path until someone happens to restart nginx — i.e. a redeploy
    # takes the site down. `resolve` on each server, plus a `zone` (which `resolve`
    # requires), makes nginx re-resolve on the TTL below instead.
    #
    # 127.0.0.11 is Docker's embedded DNS server, the only resolver that knows these
    # service names. This file is only ever used inside the compose network.
    # `ipv6=off` because the upstreams listen on IPv4 and Docker returns both.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # `keepalive` matters: without it every proxied request opens a new connection
    # to the app, which on a payment path is the kind of latency nobody can explain
    # later.
    #
    # A `zone` is not optional here — `resolve` needs one to store the address it
    # keeps refreshing.
    upstream chmabapay_api {
        zone chmabapay_api 64k;
        server api:8000 resolve;
        keepalive 16;
    }
    upstream chmabapay_web {
        zone chmabapay_web 64k;
        server landing:3001 resolve;
        keepalive 16;
    }
    upstream chmabapay_admin {
        zone chmabapay_admin 64k;
        server admin:3002 resolve;
        keepalive 16;
    }

    # Forward the original scheme and host rather than this hop's.
    #
    # Cloudflare sets X-Forwarded-Proto on the way in and this hop is plain HTTP, so
    # overwriting it with `$scheme` would tell the application every production
    # request is insecure. That value decides whether the session cookie is marked
    # Secure, so getting it wrong downgrades a cookie flag without changing anything
    # visibly. These maps preserve it when present and fall back to the truth of
    # this hop when there is no proxy in front.
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ""      $scheme;
    }
    map $http_x_forwarded_host $forwarded_host {
        default $http_x_forwarded_host;
        ""      $host;
    }

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $forwarded_proto;
    proxy_set_header X-Forwarded-Host  $forwarded_host;
    # Required for upstream keepalive; an empty Connection header is what lets the
    # connection be reused instead of closed after each request.
    proxy_set_header Connection        "";
    proxy_connect_timeout 5s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    # ----------------------------------------------------------------------- #
    # The website: marketing, the merchant dashboard, and the API paths it calls.
    # `default_server` so an unrecognised Host still lands somewhere sensible
    # rather than on whatever block happens to be first.
    # ----------------------------------------------------------------------- #
    server {
        listen 80 default_server;
        server_name _;

        # Same headers as production, minus HSTS: this edge is plain HTTP, and a
        # browser that pinned localhost to HTTPS could not reach the stack again
        # without clearing its HSTS state. Everything else matches nginx.prod.conf.
        include /etc/nginx/security-headers.inc;

        # Answers without touching an upstream, so a failing app does not make the
        # proxy itself look unhealthy and trigger a restart loop.
        location = /nginx-health {
            access_log off;
            return 200 "ok\n";
        }

        include /etc/nginx/api-locations.inc;

        # Hash-named build output keeps Next's own immutable caching and inherits the
        # headers above (it defines none of its own).
        location /_next/static/ {
            proxy_pass http://chmabapay_web;
        }

        # The signed-in workspace, never stored — see the long note in nginx.prod.conf
        # for why Next's one-year `s-maxage` on these pages matters.
        location /dashboard {
            include /etc/nginx/security-headers.inc;
            add_header Cache-Control "no-store" always;
            proxy_hide_header Cache-Control;
            proxy_pass http://chmabapay_web;
        }

        location / {
            include /etc/nginx/security-headers.inc;
            add_header Cache-Control "public, max-age=0, s-maxage=300, stale-while-revalidate=60" always;
            proxy_hide_header Cache-Control;
            proxy_pass http://chmabapay_web;
        }
    }

    # ----------------------------------------------------------------------- #
    # The platform console. Same API paths, different app for everything else.
    #
    # `admin.localhost` is here so the stack is testable on a laptop without
    # editing /etc/hosts; the real hostname is what production reaches it by.
    # ----------------------------------------------------------------------- #
    server {
        listen 80;
        server_name admin.localhost admin.chmabapay.com;

        include /etc/nginx/security-headers.inc;

        location = /nginx-health {
            access_log off;
            return 200 "ok\n";
        }

        include /etc/nginx/api-locations.inc;

        location /_next/static/ {
            proxy_pass http://chmabapay_admin;
        }

        # The whole hostname is the operator console, so the whole hostname is
        # `no-store` — mirrors nginx.prod.conf.
        location / {
            include /etc/nginx/security-headers.inc;
            add_header Cache-Control "no-store" always;
            proxy_hide_header Cache-Control;
            proxy_pass http://chmabapay_admin;
        }
    }
}
