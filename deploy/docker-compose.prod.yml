# The production stack (Docker Compose v2).
#
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d --build
#
# Run from the repository root. `--env-file` is not optional: the `${...}` values
# below are interpolated by compose from that file, and `deploy/.env` is the
# production one. It is a different file from the repository-root `.env`, which is a
# development file — it sets ENABLE_DEV_GATEWAY=true for the local `uv run uvicorn`
# loop. Copy `deploy/.env.example` to `deploy/.env` and fill it in.
#
# ---------------------------------------------------------------------------- #
# This stack is a tenant of a VPS that already runs the chmaba POS stack.
# ---------------------------------------------------------------------------- #
#
# That is the single fact that shapes this file. The POS project is live and
# revenue-generating, so nothing here may be able to interrupt it:
#
#   * **Only one host port is taken: 8443.** The proxy listens on 443 inside its own
#     container and compose publishes it as 8443. The POS stack's edge owns 80 and
#     443 and is not touched — not its compose file, not its nginx, not its certs.
#     This used to be the plan's weak point: an earlier version had both projects
#     sharing one host nginx, which would have made ChmabaPay's launch a new
#     single point of failure for a live service. Two compose projects, two ports.
#   * **The database and queue are not published at all.** No `ports:` on `db`.
#     Nothing outside this compose network has any reason to open a Postgres
#     connection, and a published 5432 on a public VPS is a brute-force target.
#   * **Logs are capped.** See `x-logging` below. An uncapped `json-file` log is the
#     ordinary way a container fills a disk, and on a shared host that is not this
#     project's outage alone.
#
# Compose projects are isolated by default: this is project `chmabapay-prod`, with its
# own bridge network, its own containers and its own `pgdata` volume. Names cannot
# collide with the POS project's. The host port above is the only shared resource,
# and it is shared by *allocation*, not by contention.
#
# `-prod` is load-bearing, not cosmetic. The repository-root docker-compose.yml also
# declares `name: chmabapay`, and a compose project name is what namespaces volumes —
# so with the same name on both, `pgdata` here and `pgdata` there would resolve to the
# *same* volume `chmabapay_pgdata`, and the same container names besides. On the VPS
# that would be invisible until someone ran the development stack there once, at which
# point production would quietly adopt that database — its accounts, its stores, and
# the test webhook endpoint pointing at a host that does not exist. A fresh production
# database has to be a property of the file, not of which stack happened to run first.

name: chmabapay-prod

# ---------------------------------------------------------------------------- #
# Log retention
# ---------------------------------------------------------------------------- #
# Docker's default logging driver writes JSON to a file that grows until the disk
# is full. On a machine also serving live POS traffic, an unbounded log from a
# payment API is a shared-fate outage rather than a local one.
#
# 10MB x 5 files = 50MB per container, which is ~300MB across this stack. Raise it
# if you want more history; the point is that it is bounded.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# ---------------------------------------------------------------------------- #
# Memory caps
# ---------------------------------------------------------------------------- #
# This VPS has 1.9GB of RAM and already runs the POS stack, which is live and
# revenue-generating. ChmabaPay adds five containers to that same 2GB.
#
# These are ceilings, not reservations: they cost nothing while the services behave,
# and they change the failure mode when one does not. Without them, a runaway Next.js
# build or a leaking worker asks the kernel for memory the POS also needs, and the
# OOM killer chooses a victim — possibly a POS container, taking down a live service
# to fix a problem it did not cause. With them, the greedy ChmabaPay container is
# killed and restarted on its own.
#
# The POS stack is deliberately left uncapped. These limits protect it from us; it is
# not this deployment's place to cap a service already in production.
x-limits: &limits
  mem_limit: 512m

x-backend-env: &backend-env
  # Built from the same three variables the `db` service is initialised with, so a
  # `POSTGRES_PASSWORD` is required rather than defaulted: the development stack
  # uses `chmaba:chmaba`, and that value reaching production is exactly the kind of
  # thing that is invisible until it matters.
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-chmaba}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}@db:5432/${POSTGRES_DB:-chmabapay}
  LOG_LEVEL: ${LOG_LEVEL:-info}

x-api-env: &api-env
  <<: *backend-env

  # -------------------------------------------------------------------------- #
  # Topology: one process, no external queue
  # -------------------------------------------------------------------------- #
  # The API drains its own queues in-process (`inprocess` + `WORKERS_ENABLED=true`),
  # which is what makes this stack have **no external dependency whose failure stops
  # payment detection**. There is deliberately no Redis service in this file: it is
  # only read when `WORKER_TRANSPORT=redis`, and paying the cost of a queue dependency
  # to gain a topology nobody is using yet is the wrong trade at launch.
  #
  # Detection survives a restart regardless, because W1 does not hold state in the
  # queue — it re-derives what to poll from non-terminal rows in the database. What
  # an in-process queue costs is throughput, not durability.
  #
  # To split the drains into a worker process later, add a `redis` service and the
  # worker service from docker-compose.yml, and set these two to `redis` and `false`.
  # The application refuses to boot on the dangerous pairing of `false` + `inprocess`
  # rather than dropping every job silently.
  WORKER_TRANSPORT: inprocess
  WORKERS_ENABLED: "true"

  # The application verifies at startup that the schema is at the Alembic head and
  # refuses to boot otherwise. It never migrates itself — the `migrate` service does,
  # and everything that reads the schema waits for it.
  SCHEMA_CHECK: "true"

  # The fake Bakong rail, hardcoded OFF rather than interpolated from the env file.
  # `/_dev/payments/{id}/pay` marks a payment paid without money moving, and
  # `/auth/_dev/login` mints a real session for any email named with no credential.
  # A value that is inherited from a file is not a default; see the long note in
  # docker-compose.yml.
  ENABLE_DEV_GATEWAY: "false"

  # -------------------------------------------------------------------------- #
  # Identity
  # -------------------------------------------------------------------------- #
  # Required, and required loudly: the application's built-in default is a
  # placeholder published in this repository, so sessions signed with it can be
  # forged by anyone who has read the source.
  #   python -c "import secrets; print(secrets.token_urlsafe(48))"
  JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY in deploy/.env - see deploy/.env.example}
  JWT_TTL_SECONDS: ${JWT_TTL_SECONDS:-86400}

  # Required. It is the canonical origin, and it wins over the forwarded headers for
  # the OAuth redirect URI and for whether the session cookie is marked Secure. Left
  # empty it is derived from `X-Forwarded-Proto`/`X-Forwarded-Host` instead — which
  # works, and is a silent dependency on the edge forwarding them correctly. Set it,
  # so the value is a decision rather than an inference.
  PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:?set PUBLIC_ORIGIN in deploy/.env, e.g. https://pay.chmaba.com}
  # Google compares the redirect URI byte for byte, so this must equal what is
  # registered in the GCP Console — including the scheme and the absence of a
  # trailing slash.
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
  # The OAuth callback is answered by the API at /auth/google/callback, which the
  # default "/" would land the user back on — and "/" is the FastAPI root, not the
  # website. Point this at the site.
  POST_LOGIN_REDIRECT_URL: ${POST_LOGIN_REDIRECT_URL:-https://pay.chmaba.com/dashboard}

  # Browser origins allowed to call this API. Never "*": the wildcard is gone
  # deliberately, and browsers reject it combined with credentials. Server-to-server
  # callers — the usual POS integration — are unaffected, because CORS is a browser
  # mechanism.
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://pay.chmaba.com,https://admin-pay.chmaba.com}

  # -------------------------------------------------------------------------- #
  # Alerts. Without these two, every alert is a log line and nothing is paged.
  # -------------------------------------------------------------------------- #
  # The chat must have sent /start to the bot: a bot cannot open a conversation, and
  # Telegram answers HTTP 200 with `ok: false` when it is asked to. See docs/deploy.md §5.
  TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
  OPS_TELEGRAM_CHAT_ID: ${OPS_TELEGRAM_CHAT_ID:-}
  # Set a token or /metrics is served unauthenticated. It is not routed at the edge
  # (deploy/nginx/api-locations.inc has no location for it), so this is the second
  # line of defence rather than the only one.
  METRICS_TOKEN: ${METRICS_TOKEN:-}

  # -------------------------------------------------------------------------- #
  # Money
  # -------------------------------------------------------------------------- #
  # Bakong is what makes payment detection real. A token, or a developer email the
  # client can mint one from — one of the two.
  BAKONG_API_TOKEN: ${BAKONG_API_TOKEN:-}
  BAKONG_DEVELOPER_EMAIL: ${BAKONG_DEVELOPER_EMAIL:-}

  # Platform-admin bootstrap: the first sign-in from one of these addresses is
  # promoted. The HQ store that billing self-pay charges against is created from it,
  # and without an HQ PayWay link a self-pay invoice cannot produce a QR.
  CHMABAPAY_ADMIN_EMAILS: ${CHMABAPAY_ADMIN_EMAILS:-}
  CHMABAPAY_ADMIN_PASSWORD: ${CHMABAPAY_ADMIN_PASSWORD:-}
  CHMABAPAY_HQ_STORE_ID: ${CHMABAPAY_HQ_STORE_ID:-}
  CHMABAPAY_HQ_PAYWAY_LINK: ${CHMABAPAY_HQ_PAYWAY_LINK:-}

  RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    <<: *limits
    logging: *logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chmaba}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: ${POSTGRES_DB:-chmabapay}
    # No `ports:`. The development stack publishes 55432 so `psql` on the host can
    # reach it; production does not need that, and a Postgres port reachable from the
    # internet is a standing invitation. Use
    # `docker compose -f deploy/docker-compose.prod.yml exec db psql -U chmaba chmabapay`
    # instead — same access, through a connection that is already authenticated.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chmaba} -d ${POSTGRES_DB:-chmabapay}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Schema changes, applied once, before anything that reads the schema starts. A
  # separate one-shot service because the application is deliberately not allowed to
  # migrate itself, and because two processes racing to migrate is a failure mode
  # worth designing out before there are two of them.
  migrate:
    build:
      context: ..
      dockerfile: Dockerfile
    command: ["alembic", "upgrade", "head"]
    environment: *api-env
    <<: *limits
    logging: *logging
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    logging: *logging
    <<: *limits
    environment: *api-env
    # No `ports:`. The only published port in this whole file is the proxy's. The API
    # is reached as `api:8000` on the compose network, by the proxy. Publishing 8000
    # would put the API's own TLS-less HTTP surface on the internet next to the edge
    # — reachable by IP, without the Host routing, the refusals in
    # api-locations.inc, or Cloudflare in front of it.
    depends_on:
      db:
        condition: service_healthy
      # The gate: no API process until the schema is at head. Without it the API
      # starts first, finds the database behind, and refuses to boot — correct, but
      # it produces a crash loop that reads like an image problem.
      migrate:
        condition: service_completed_successfully
    # Healthcheck comes from the image (`/health`, shallow by design — a database
    # blip must not make a working API look unhealthy and get it restarted).

  landing:
    build:
      context: ..
      dockerfile: web/Dockerfile
      args:
        APP: landing
        # A *build* arg, not only the runtime variable below: `rewrites()` is
        # evaluated during `next build` and the resolved destinations are baked into
        # the build manifest, so a value supplied only at run time is read too late.
        # Observed, not assumed — with this set at run time alone the container still
        # dialled the `127.0.0.1:8000` fallback and answered 500 `ECONNREFUSED` for
        # every rewritten path.
        NEXT_PUBLIC_API_URL: http://api:8000
    restart: unless-stopped
    logging: *logging
    <<: *limits
    environment:
      NEXT_PUBLIC_API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3001/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5

  admin:
    build:
      context: ..
      dockerfile: web/Dockerfile
      args:
        APP: admin
        NEXT_PUBLIC_API_URL: http://api:8000
    restart: unless-stopped
    logging: *logging
    <<: *limits
    environment:
      NEXT_PUBLIC_API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3002/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    logging: *logging
    <<: *limits
    ports:
      # The only host port this stack takes. 443 inside the container; 8443 on the
      # VPS, because 80 and 443 belong to the POS project's edge.
      #
      # Bind to the public interface, not to 127.0.0.1: Cloudflare has to reach it.
      # What keeps other traffic out is the host firewall — restrict 8443 to
      # Cloudflare's ranges (cloudflare.com/ips-v4 and /ips-v6) — which is defence in
      # depth rather than the control itself: deploy/nginx/nginx.prod.conf trusts the
      # client address only when the peer is Cloudflare, so a direct connection cannot
      # spoof one either way.
      - "8443:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/api-locations.inc:/etc/nginx/api-locations.inc:ro
      # Cloudflare Origin CA certificate covering pay.chmaba.com **and**
      # admin-pay.chmaba.com, as fullchain.pem + privkey.pem. Read-only, and
      # deploy/certs/ is gitignored so a private key cannot be committed by accident.
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      api:
        condition: service_healthy
      landing:
        condition: service_started
      admin:
        condition: service_started
    healthcheck:
      # Plain HTTP on 80, inside the container's own namespace. It never touches an
      # upstream (a restarting app must not make the edge look unhealthy) and it needs
      # no certificate trust, which is why the healthcheck is not aimed at 443.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/nginx-health"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 5

  # Monitoring: scrape this deployment and forward it to Grafana Cloud. Closes the
  # last caveat in P1-3 — until now /metrics was published and never fetched, so
  # every number in it evaporated.
  #
  # **Behind a profile, opt-in, and not in the default stack on purpose.** The plain
  # `up -d --build` must not depend on a third-party account: if the GRAFANA_*
  # variables are unset, a mandatory service would refuse to start and take the live
  # stack down over a dashboard. Same reasoning as the `worker` service in the
  # development compose file, and the same shape.
  #
  #   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env \
  #       --profile monitoring up -d prometheus
  #
  # Agent mode rather than a full Prometheus. This host has ONE core and 1.9GB of RAM
  # shared with a live POS stack, and a full Prometheus would add a TSDB, a query API
  # and a rule engine that nobody would ever query locally — the data is read in
  # Grafana Cloud. Agent mode keeps only a ~2h WAL, so delivery survives a Grafana
  # outage and the process stays small enough for the cap below.
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: ["monitoring"]
    restart: unless-stopped
    logging: *logging
    # Half the app ceiling on purpose. `*limits` exists to stop a ChmabaPay container
    # starving the POS stack; a metrics forwarder has no business claiming 512MB of a
    # 1.9GB host, and agent mode needs well under this.
    mem_limit: 256m
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        # Checked here, not in the `environment:` block, and that distinction is
        # load-bearing: compose interpolates the ENTIRE file at parse time, including
        # services whose profile is not active. A required-variable form (`:?`) in the
        # environment block therefore broke `up -d --build` — the plain production
        # deploy — over a variable that deploy never reads. Verified by running it:
        # the default stack refused to render with "required variable
        # GRAFANA_METRICS_TOKEN is missing a value". Defaulting those variables to
        # empty and refusing HERE means a missing value can only ever fail the
        # monitoring container itself.
        : "$${METRICS_TOKEN:?METRICS_TOKEN is not set in deploy/.env - see docs/deploy.md section 13}"
        : "$${GRAFANA_REMOTE_WRITE_URL:?GRAFANA_REMOTE_WRITE_URL is not set in deploy/.env - see docs/deploy.md section 13}"
        : "$${GRAFANA_METRICS_USERNAME:?GRAFANA_METRICS_USERNAME is not set in deploy/.env - see docs/deploy.md section 13}"
        : "$${GRAFANA_METRICS_TOKEN:?GRAFANA_METRICS_TOKEN is not set in deploy/.env - see docs/deploy.md section 13}"
        sed -e "s|__METRICS_TOKEN__|$$METRICS_TOKEN|g" \
            -e "s|__GRAFANA_METRICS_USERNAME__|$$GRAFANA_METRICS_USERNAME|g" \
            -e "s|__GRAFANA_METRICS_TOKEN__|$$GRAFANA_METRICS_TOKEN|g" \
            -e "s|__GRAFANA_REMOTE_WRITE_URL__|$$GRAFANA_REMOTE_WRITE_URL|g" \
            /etc/prometheus/prometheus.yml.tpl > /tmp/prometheus.yml
        /bin/promtool check config /tmp/prometheus.yml
        exec /bin/prometheus \
          --config.file=/tmp/prometheus.yml \
          --agent \
          --storage.agent.path=/prometheus \
          --web.listen-address=:9090
    environment:
      # Deliberately NOT the app environment (`*backend-env`). A metrics forwarder has
      # no business holding DATABASE_URL, and inheriting it here would put the
      # production database password into a container whose only job is to read a
      # public-by-design metrics endpoint.
      #
      # Defaulted to empty rather than using a required-variable form (`:?`), because
      # compose interpolates every service in the file whether or not its profile is
      # active — so a `:?` here would break the ordinary production deploy over a
      # variable it never reads. The entrypoint refuses on an empty value instead,
      # which confines the failure to the monitoring container. See `command:` above.
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      GRAFANA_REMOTE_WRITE_URL: ${GRAFANA_REMOTE_WRITE_URL:-}
      GRAFANA_METRICS_USERNAME: ${GRAFANA_METRICS_USERNAME:-}
      GRAFANA_METRICS_TOKEN: ${GRAFANA_METRICS_TOKEN:-}
    volumes:
      # The template alone. The rendered config, and the token inside it, exist only
      # on the container's writable layer — no secret is written back to the host.
      - ./prometheus/prometheus.yml.tpl:/etc/prometheus/prometheus.yml.tpl:ro
      # Agent-mode WAL: the retry buffer for samples Grafana has not accepted yet.
      # A named volume rather than the container layer so that recreating the
      # container does not discard a pending backlog — and so that repeated deploys
      # do not leave a trail of orphaned anonymous volumes on a host with 20GB free.
      - prometheusdata:/prometheus
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  prometheusdata:
