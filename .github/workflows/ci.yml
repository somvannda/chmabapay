name: CI

# The gate described in docs/production-readiness.md P0-4. Every push and every
# pull request runs it; make the `verify` job a required check on the default
# branch so it actually blocks a merge.
on:
  push:
  pull_request:

jobs:
  verify:
    name: lint, migrate, test
    runs-on: ubuntu-latest

    # Postgres, not SQLite. The suite used to run on SQLite only, which hides
    # Postgres-only bugs — it returns naive datetimes for tz-aware columns, and
    # cross-event-loop connection reuse went unnoticed until the first Postgres
    # run failed every single test. Production is Postgres, so the gate is too.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: chmabapay_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # P2-3. The queue tests default to `fakeredis` so the suite stays runnable with
      # no services at all, and select a real server when `CHMABAPAY_TEST_REDIS_URL`
      # is set — which is here. Without this the stream commands the transport is
      # built on (XREADGROUP, XAUTOCLAIM, the consumer-group pending list) would only
      # ever be proved against a simulator.
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/chmabapay_test
      # conftest.py deliberately ignores the app's DATABASE_URL and reads this
      # one instead, so a stray ambient value can never aim the destructive
      # fixtures at a real database. The name must contain "test"; it is checked.
      CHMABAPAY_TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/chmabapay_test
      # DB 15, away from the default: the fixture flushes this database between tests.
      CHMABAPAY_TEST_REDIS_URL: redis://localhost:6379/15

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      # Proves migrations are the complete and only schema path: applying them to
      # an empty database must land exactly on the models, and `check` exits
      # non-zero the moment a model changes without a matching revision.
      - name: Migrate
        run: uv run alembic upgrade head

      - name: Migrations match the models
        run: uv run alembic check

      - name: Test
        run: uv run pytest

      # Advisory, not a gate: 26 pre-existing errors in 9 files. Flip
      # `continue-on-error` off once that reaches zero — see P0-4.
      - name: Types (advisory)
        run: uv run mypy
        continue-on-error: true

  frontend:
    name: typecheck and build the web apps
    runs-on: ubuntu-latest

    # Node 20 and pnpm 9 are copied from `web/Dockerfile` rather than chosen here.
    # That file is what builds the deployable images and it pins both — pnpm 9
    # because it wrote `pnpm-lock.yaml` (lockfileVersion 9.0) and a newer pnpm
    # refuses a lockfile it did not write. A frontend job on a different toolchain
    # would be checking a build nobody deploys.
    #
    # This job did not exist until the audit found that nothing checked either app:
    # `next dev` ran fine, so every frontend change was verified by hand and a
    # broken `next build` — which is the only build that matters — would have gone
    # green.
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # `--prod=false` is spelled out for the same reason the Dockerfile spells it
      # out: pnpm 9 reads NODE_ENV when pruning, and `typescript` is a
      # devDependency. Without it Next cannot load tsconfig `paths`, and every `@/`
      # import fails over files that are sitting right there.
      - name: Install
        run: pnpm install --frozen-lockfile --prod=false

      # `next lint` is deliberately not run: eslint is not a dependency of either
      # app, so it would prompt to install itself and hang on a runner.
      - name: Typecheck and build landing
        run: |
          pnpm --filter @chmabapay/landing typecheck
          pnpm --filter @chmabapay/landing build

      - name: Typecheck and build admin
        run: |
          pnpm --filter @chmabapay/admin typecheck
          pnpm --filter @chmabapay/admin build
